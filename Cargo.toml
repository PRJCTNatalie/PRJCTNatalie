[package]
name = "prjctnatalie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Natalie — an AI agent, named after her maintainer."
license = "MIT"
authors = ["Natalie <natalie@acreetionos.org>"]

[dependencies]
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["full", "test-util"] }

[[bin]]
name = "natalie"
path = "src/main.rs"

[lib]
name = "prjctnatalie"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
